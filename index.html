<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowCraft AI — لوحة تحكم ذكية من ملف الإكسيل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--paper:#FBFCFA;--ink:#14201B;--muted:#5B6B63;--grid:#DCE5DF;--card:#fff;--green:#1D6F42;--green-s:#E3F1E9;--amber:#C98200;--err:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1713;--ink:#E8F0EA;--muted:#93A59A;--grid:#25342C;--card:#16211B;--green:#4CC183;--green-s:#18301F;--amber:#F0B33C;--err:#FF8A80}}
:root[data-theme="dark"]{--paper:#0F1713;--ink:#E8F0EA;--muted:#93A59A;--grid:#25342C;--card:#16211B;--green:#4CC183;--green-s:#18301F;--amber:#F0B33C;--err:#FF8A80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.8 "IBM Plex Sans Arabic",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font:700 20px "Readex Pro",sans-serif;display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--green);display:grid;grid-template:repeat(2,1fr)/repeat(2,1fr);gap:2px;padding:4px}
.logo i b{background:var(--paper);border-radius:1px}.logo i b:first-child{grid-column:span 2}
.nav{background:var(--green);color:var(--paper);padding:8px 18px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px}
.hero{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;background-position:center top;border-bottom:1px solid var(--grid)}
.hero .wrap{padding-top:56px;padding-bottom:64px}
h1{font:700 clamp(32px,6vw,56px)/1.35 "Readex Pro",sans-serif;margin:0 0 18px;max-width:15em;background:var(--paper);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 8px}
.hero p{max-width:34em;color:var(--muted);margin:22px 0 0;background:var(--paper);padding:2px 8px;display:inline-block}
.sheet{margin-top:36px;display:inline-grid;grid-template-columns:repeat(4,minmax(70px,auto));border:1px solid var(--grid);background:var(--card);border-radius:10px;overflow:hidden;font-size:14px}
.sheet span{padding:6px 14px;border-inline-start:1px solid var(--grid);border-top:1px solid var(--grid);color:var(--muted)}
.sheet .h{background:var(--green-s);color:var(--green);font-weight:600;border-top:0}
.sheet .s{background:var(--green);color:var(--paper);font-weight:600}
section.try{padding:56px 0}
.panel{background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:24px}
.drop{display:block;border:2px dashed var(--green);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;background:var(--green-s);transition:background .2s}
.drop.on,.drop:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.drop strong{display:block;font-size:19px}.drop small{color:var(--muted)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
textarea{width:100%;margin-top:18px;min-height:90px;padding:12px 14px;border-radius:10px;border:1px solid var(--grid);background:var(--paper);color:var(--ink);font:inherit;resize:vertical}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--grid);background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--green);color:var(--green)}
.go{margin-top:20px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--green);color:var(--paper);font:600 18px "IBM Plex Sans Arabic",sans-serif;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
#msg{margin-top:12px;min-height:1.6em;color:var(--muted);font-size:15px}#msg.e{color:var(--err)}
#out{display:none;margin-top:36px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--grid);border-inline-start:4px solid var(--green);border-radius:10px;padding:14px 16px}
.kpi small{color:var(--muted);display:block}.kpi b{font:700 28px "Readex Pro",sans-serif}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.chart{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:16px}
.chart h3{margin:0 0 10px;font:500 16px "Readex Pro",sans-serif}.chart div{position:relative;height:280px}
footer{border-top:1px solid var(--grid);padding:24px 0;color:var(--muted);text-align:center;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.ans{display:none;margin:0 0 16px;padding:18px 20px;background:var(--green-s);border-inline-start:4px solid var(--green);border-radius:10px}
.ans:not(:empty){display:block}.ans p{margin:6px 0 0}.ans .sub{color:var(--muted);font-size:15px}
.chart small{display:block;margin-top:8px;color:var(--muted);font-size:14px}
#rep{margin-top:14px}.blk{margin-top:24px}.blk h3{font:500 20px "Readex Pro",sans-serif;margin:0 0 10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.find{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:14px 16px}
.find b{font:700 26px "Readex Pro",sans-serif;color:var(--green)}.find h4{margin:0;font-size:17px}.find p{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.7}
.blk ul{margin:0;padding-inline-start:20px}
.act{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--grid)}.act p{margin:0}.act small{color:var(--muted)}
.tag{flex:none;padding:2px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--green-s);color:var(--green)}
.tag.high{background:var(--amber);color:#14201B}.tag.low{background:var(--grid);color:var(--muted)}
</style>
</head>
<body>
<div class="hero">
<div class="wrap">
<header id="top"><a class="logo" href="#top"><i aria-hidden="true"><b></b><b></b><b></b></i>FlowCraft AI</a><a class="nav" href="#try">جرّب النظام</a></header>
<h1>ارفع الشيت، واللوحة تتبني لوحدها</h1><br>
<p>كل رقم بيتحسب من ملفك نفسه بدقة، والرسومات بتتختار على حسب نوع بياناتك وطلبك، فمفيش شكل ثابت.</p><br>
<div class="sheet" aria-hidden="true"><span class="h">المنتج</span><span class="h">الشهر</span><span class="h">المبيعات</span><span class="h">الربح</span>
<span>شاي</span><span>يناير</span><span>12,400</span><span class="s">3,100</span><span>قهوة</span><span>يناير</span><span>18,900</span><span class="s">6,700</span></div>
</div></div>

<section class="try" id="try"><div class="wrap"><div class="panel">
<label class="drop" id="drop"><input type="file" id="file" accept=".xlsx,.xls,.csv">
<strong id="fname">اسحب ملف الإكسيل هنا أو اضغط للاختيار</strong><small>.xlsx / .xls / .csv — حتى 10 ميجا</small></label>
<textarea id="ask" aria-label="طلبك" placeholder="اكتب اللي عايز تعرفه من الشيت"></textarea>
<div class="chips"><button class="chip" type="button">اعملي Dashboard شامل للمبيعات</button><button class="chip" type="button">إيه أكتر المنتجات ربحاً؟</button><button class="chip" type="button">حلل الأداء حسب الوقت</button></div>
<button class="go" id="go" type="button">حلل وابنِ لوحة التحكم</button>
<div id="msg" role="status"></div></div>
<div id="out"><div id="sum" class="ans"></div><div class="kpis" id="kpis"></div><div class="charts" id="charts"></div><div id="rep"></div></div>
</div></section>
<footer>© FlowCraft AI</footer>

<script>
// ===== حط هنا رابط الـ Webhook بتاع n8n (Production URL) =====
// مثال: https://YOUR-N8N-HOST/webhook/flowcraft-api
const WEBHOOK_URL="https://mrmrwan.app.n8n.cloud/webhook/flowcraft-api";
const $=s=>document.querySelector(s),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],PR={high:"أولوية عالية",medium:"أولوية متوسطة",low:"أولوية منخفضة"};
const PAL=["#1D6F42","#C98200","#2E86AB","#A23B72","#6C757D","#4CC183","#F18F01","#7B2CBF"];
const r2=n=>Math.round(n*100)/100,fmt=n=>Math.abs(n)>=1e6?(n/1e6).toFixed(2)+"M":Math.abs(n)>=1e3?(n/1e3).toFixed(1)+"K":(+n.toFixed(2)).toLocaleString("en");
let rows=[],cols=[],charts=[],curFile=null;
const msg=(t,e)=>{$("#msg").textContent=t;$("#msg").className=e?"e":""};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("#ask").value=c.textContent});
const mm=a=>a.reduce((o,x)=>({lo:Math.min(o.lo,x),hi:Math.max(o.hi,x)}),{lo:Infinity,hi:-Infinity});
function profile(){
 cols=Object.keys(rows[0]).map(name=>{
  const v=rows.map(r=>r[name]).filter(x=>x!=null&&x!==""),n=v.filter(x=>typeof x==="number"),d=v.filter(x=>x instanceof Date),c={name,type:"text",filled:v.length};
  if(!v.length)return c;
  if(d.length/v.length>.8){c.type="date";const t=mm(d.map(x=>+x));c.from=new Date(t.lo).toISOString().slice(0,10);c.to=new Date(t.hi).toISOString().slice(0,10)}
  else if(n.length/v.length>.8){const u=new Set(n).size;c.type=(u===n.length&&/id|رقم|كود|code/i.test(name))?"id":"number";
   if(c.type==="number"){c.sum=r2(n.reduce((s,x)=>s+x,0));c.avg=r2(c.sum/n.length);const t=mm(n);c.min=t.lo;c.max=t.hi}}
  else{const u=new Set(v.map(String)).size;if(u>1&&u<=60){c.type="category";c.unique=u}}
  return c})}
function group(x,y,agg){
 const dc=cols.find(c=>c.type==="date"),t=new Map();
 rows.forEach(r=>{let k;
  if(x==="__weekday"){const d=dc&&r[dc.name];if(!(d instanceof Date))return;k=d.getDay()}
  else{const v=r[x];if(v==null||v==="")return;k=v instanceof Date?v.toISOString().slice(0,7):String(v)}
  const val=y?+r[y]:1;if(isNaN(val))return;
  const o=t.get(k)||{s:0,n:0,mx:-Infinity,mn:Infinity};o.s+=val;o.n++;o.mx=Math.max(o.mx,val);o.mn=Math.min(o.mn,val);t.set(k,o)});
 return [...t].map(([k,o])=>({k,v:agg==="avg"?o.s/o.n:agg==="count"?o.n:agg==="max"?o.mx:agg==="min"?o.mn:o.s}))}
function digest(){
 const nums=cols.filter(c=>c.type==="number"),cats=cols.filter(c=>c.type==="category"),dc=cols.find(c=>c.type==="date"),D={rows:rows.length,totals:{},byCategory:{}};
 const tb=g=>{const s=[...g].sort((a,b)=>b.v-a.v);return{top:s.slice(0,10).map(o=>[o.k,r2(o.v)]),bottom:s.slice(-3).map(o=>[o.k,r2(o.v)])}};
 nums.forEach(c=>D.totals[c.name]={sum:c.sum,avg:c.avg,min:c.min,max:c.max});
 cats.slice(0,6).forEach(c=>{const o=D.byCategory[c.name]={"عدد السجلات":tb(group(c.name,null,"count"))};nums.slice(0,4).forEach(n=>{o[n.name]=tb(group(c.name,n.name,"sum"))})});
 if(dc){D.dateRange=[dc.from,dc.to];D.byMonth={};D.byWeekday={};
  nums.slice(0,4).forEach(n=>{D.byMonth[n.name]=group(dc.name,n.name,"sum").sort((a,b)=>a.k<b.k?-1:1).slice(-36).map(o=>[o.k,r2(o.v)]);
   D.byWeekday[n.name]=group("__weekday",n.name,"sum").sort((a,b)=>a.k-b.k).map(o=>[DAYS[o.k],r2(o.v)])})}
 return D}
async function load(f){
 if(!f)return;curFile=f;
 if(f.size>10*1024*1024){msg("الملف أكبر من 10 ميجا، قلل حجمه وجرب تاني.",1);return}
 try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
  rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null});
  if(rows.length)profile();
  $("#fname").textContent=f.name+" — "+rows.length+" صف";
  msg(rows.length?"الملف جاهز. اكتب طلبك أو اضغط تحليل.":"الشيت فاضي، اختار ملف فيه بيانات.",!rows.length)
 }catch(e){rows=[];msg("مش قادر أقرأ الملف. اتأكد إنه xlsx أو xls أو csv سليم.",1)}}
$("#file").onchange=e=>load(e.target.files[0]);
const dz=$("#drop");["dragover","dragenter"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add("on")}));
["dragleave","drop"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove("on")}));
dz.addEventListener("drop",e=>load(e.dataTransfer.files[0]));
function mk(title,cfg,note){const w=el("div","chart");w.appendChild(el("h3",null,title));const h=el("div");h.appendChild(document.createElement("canvas"));w.appendChild(h);
 if(note)w.appendChild(el("small",null,note));$("#charts").appendChild(w);charts.push(new Chart(w.querySelector("canvas"),cfg))}
const num=n=>cols.find(c=>c.name===n&&c.type==="number");
function widget(w){
 const agg=w.agg||"sum";
 if(w.type==="kpi"){let v;if(agg==="count")v=rows.length;else{const c=num(w.y);if(!c)return;v=c[agg==="avg"?"avg":agg==="max"?"max":agg==="min"?"min":"sum"]}
  const k=el("div","kpi");k.appendChild(el("small",null,w.title||w.y||""));k.appendChild(el("b",null,fmt(v)));$("#kpis").appendChild(k);return}
 const wk=w.x==="__weekday",xc=cols.find(c=>c.name===w.x);
 if(!wk&&!xc)return;if(wk&&!cols.some(c=>c.type==="date"))return;if(w.y&&!num(w.y))return;if(!w.y&&agg!=="count")return;
 const isT=wk||xc.type==="date",pie=w.type==="pie",line=w.type==="line";
 if(line&&!isT)return;
 let g=group(w.x,w.y,agg);
 if(isT)g.sort((p,q)=>wk?p.k-q.k:(p.k<q.k?-1:1));else{g.sort((p,q)=>q.v-p.v);g=g.slice(0,pie?6:(w.top||10))}
 const gr=css("--grid");
 mk(w.title||"",{type:pie?"doughnut":line?"line":"bar",data:{labels:g.map(o=>wk?DAYS[o.k]:o.k),datasets:[{data:g.map(o=>r2(o.v)),backgroundColor:pie?PAL:line?PAL[1]:PAL[0],borderColor:PAL[1],borderRadius:line?0:4,tension:.3}]},
  options:{responsive:true,maintainAspectRatio:false,indexAxis:w.type==="hbar"?"y":"x",plugins:{legend:{display:pie,position:"bottom"}},scales:pie?{}:{x:{grid:{color:gr}},y:{grid:{color:gr},beginAtZero:true}}}},w.note)}
function section(p,t){const s=el("section","blk");s.appendChild(el("h3",null,t));p.appendChild(s);return s}
function list(p,a){const u=el("ul");a.forEach(x=>u.appendChild(el("li",null,x)));p.appendChild(u)}
const has=a=>Array.isArray(a)&&a.length;
function render(d){
 charts.forEach(c=>c.destroy());charts=[];["#kpis","#charts","#rep","#sum"].forEach(s=>$(s).replaceChildren());
 Chart.defaults.font.family='"IBM Plex Sans Arabic",sans-serif';Chart.defaults.color=css("--muted");
 const a=d.analysis||{},S=$("#sum");
 if(d.answer){S.appendChild(el("b",null,"الإجابة على طلبك"));S.appendChild(el("p",null,d.answer))}
 const ex=a.executive_summary||d.report;if(ex)S.appendChild(el("p","sub",ex));
 (((d.dashboard_spec||{}).widgets)||[]).forEach(w=>{try{widget(w)}catch(e){}});
 const R=$("#rep");
 if(has(a.key_findings)){const s=section(R,"أهم النتائج"),g=el("div","grid3");a.key_findings.forEach(f=>{const c=el("div","find");c.appendChild(el("b",null,f.metric||""));c.appendChild(el("h4",null,f.title||""));c.appendChild(el("p",null,f.detail||""));g.appendChild(c)});s.appendChild(g)}
 if(has(a.risks)||has(a.opportunities)){const g=el("div","grid2");R.appendChild(g);[["المخاطر",a.risks],["الفرص",a.opportunities]].forEach(([t,x])=>{if(has(x))list(section(g,t),x)})}
 if(has(a.actions)){const s=section(R,"خطة التنفيذ");a.actions.forEach(x=>{const r=el("div","act");r.appendChild(el("span","tag "+x.priority,PR[x.priority]||x.priority||""));const t=el("div");t.appendChild(el("p",null,x.action));if(x.expected_impact)t.appendChild(el("small",null,"الأثر المتوقع: "+x.expected_impact));r.appendChild(t);s.appendChild(r)})}
 else if(has(d.recommendations))list(section(R,"أهم التوصيات"),d.recommendations)}
$("#go").onclick=async()=>{
 if(!rows.length){msg("اختار ملف الأول.",1);return}
 if(!WEBHOOK_URL){msg("رابط الـ Webhook لسه ما اتحطش في الملف (WEBHOOK_URL).",1);return}
 const b=$("#go");b.disabled=true;msg("بنحلل الشيت ونصمم اللوحة... ممكن ياخد لحد دقيقة.");
 try{
  const body={prompt:$("#ask").value.trim()||"اعملي Dashboard شامل مع تحليل كامل",fileName:curFile.name,rowCount:rows.length,columns:cols,digest:digest(),sampleRows:rows.slice(0,8)};
  const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  let d=await r.json();if(Array.isArray(d))d=d[0];
  if(!d||(!d.answer&&!d.analysis&&!d.dashboard_spec&&!d.report))throw new Error("الرد فاضي");
  render(d);$("#out").style.display="block";msg("تم التحليل.");$("#out").scrollIntoView({behavior:"smooth"})
 }catch(e){msg("حصلت مشكلة مع الـ Workflow ("+e.message+"). اتأكد إنه Active وإن الرابط هو الـ Production URL.",1)}
 b.disabled=false};
</script>
</body>
</html>
